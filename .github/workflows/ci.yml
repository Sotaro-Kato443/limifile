name: LimiFile CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PUBLIC_ALLOW_INDEXING: "false"

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify 404 handling
        run: npm run verify:404

      - name: Verify license distribution
        run: npm run verify:licenses

      - name: Verify i18n/SEO foundation
        run: npm run verify:i18n-seo-foundation

      - name: Verify trust pages
        run: npm run verify:trust-pages

      - name: Verify tool SEO content
        run: npm run verify:tool-seo-content

      - name: Verify search publication files
        run: npm run verify:search-publication

      - name: Verify LGPL HEIC source package (lightweight, no rebuild)
        run: npm run verify:lgpl-heic-source-package
